[project]
name = "pitch-agent"
version = "0.1.0"
description = "Prepares restaurant sales visits from public reviews and a fixed DISH product catalog"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
pitch-agent = "pitch_agent.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pitch_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
